<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模拟聊天室 · 对话审阅</title>
<style>
:root{--ink:#192b25;--muted:#6b7c73;--line:#dce5df;--green:#226b50;--soft:#edf5ef;--red:#a63027;--amber:#94620e}*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select,input,textarea{font:inherit}button,select,input{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 10px;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--green)}button.primary{background:var(--green);color:white}button:disabled{opacity:.5;cursor:wait}a{color:var(--green);text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 22px;background:white;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 6px}h2{font-size:14px;margin:0}h3{font-size:13px;margin:0 0 8px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.badge{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;background:#edf0ed;color:#5c6b62}.badge.passed,.badge.acceptable,.badge.glm{background:#e1f1e7;color:var(--green)}.badge.failed,.badge.incorrect{background:#fbe8e5;color:var(--red)}.badge.degraded,.badge.uncertain,.badge.rule_fallback{background:#fff0d5;color:var(--amber)}.badge.group{background:#e8eff9;color:#315c91}.mono{font:11px ui-monospace,SFMono-Regular,monospace}.error{color:var(--red)}.status-band{display:flex;flex-wrap:wrap;gap:20px;padding:11px 22px;border-bottom:1px solid var(--line);background:var(--soft)}.status-band strong{margin-left:7px}.review-band{display:flex;justify-content:space-between;gap:12px;padding:10px 22px;border-bottom:1px solid var(--line);background:white}.review-band input{width:220px}.layout{height:calc(100vh - 184px);min-height:540px;display:grid;grid-template-columns:205px 235px minmax(350px,1fr) 325px}.pane{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:white}.pane:last-child{border:0}.pane-head{min-height:46px;padding:12px;display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.scroll{overflow:auto;min-height:0;flex:1}.list-item{width:100%;display:block;border:0;border-bottom:1px solid #ecf0ed;border-radius:0;padding:12px;text-align:left;background:white}.list-item.active{background:var(--soft);box-shadow:inset 3px 0 var(--green)}.list-title{display:flex;justify-content:space-between;gap:6px;font-weight:600}.list-meta{margin-top:6px;font-size:12px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}.chat-head{padding:13px 17px;min-height:72px;border-bottom:1px solid var(--line)}.chat-title{font-weight:650;font-size:15px;margin-bottom:6px}.chat{flex:1;min-height:0;overflow:auto;padding:18px;background:#f5f7f5}.turn{margin-bottom:21px;padding:5px;border-radius:7px;cursor:pointer}.turn.selected{box-shadow:0 0 0 2px #92b9a3}.speaker{font-size:12px;color:var(--muted);margin-bottom:6px}.bubble{background:white;border:1px solid var(--line);padding:11px 13px;border-radius:7px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.agent-row{display:flex;justify-content:flex-end;margin-top:9px}.agent-row .bubble{background:#e5f1e8;border-color:#c5dccb}.empty{color:var(--muted);font-style:italic}.foot{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:11px}.detail{overflow:auto;padding:15px}.detail-section{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.kv{display:grid;grid-template-columns:78px 1fr;gap:7px;font-size:12px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;background:#f5f7f5;padding:9px;border:1px solid var(--line);border-radius:5px}summary{cursor:pointer;font-size:12px;color:var(--green)}textarea{width:100%;height:76px;border:1px solid var(--line);border-radius:5px;padding:8px;resize:vertical}.empty-state{padding:35px 20px;text-align:center;line-height:1.8;color:var(--muted)}.notice{padding:9px 11px;background:#fff5e3;border-radius:5px;font-size:12px;line-height:1.6}.tool{margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
@media(max-width:1250px){.layout{grid-template-columns:170px 200px minmax(320px,1fr)}.inspector{grid-column:1/-1;border-top:1px solid var(--line);max-height:400px}.layout{height:auto}.chat{height:65vh}.pane.runs,.pane.views{max-height:75vh}}
@media(max-width:760px){header,.review-band{flex-direction:column;align-items:stretch}.layout{grid-template-columns:130px minmax(0,1fr)}.views{grid-column:1/-1;max-height:200px!important}.messages{grid-column:2;grid-row:1}.runs{grid-row:1}.review-band input{width:100%}.bubble{max-width:95%}.status-band{gap:10px}}
body{height:100vh;display:flex;flex-direction:column}header,.status-band,.review-band{flex-shrink:0}.layout{height:auto;min-height:0;flex:1}.pane{min-height:0}
@media(max-width:1250px){body{height:auto;min-height:100vh}.layout{flex:none;grid-template-rows:minmax(350px,70vh)400px}.chat{height:auto}.pane.runs,.pane.views{max-height:none}}
@media(max-width:760px){.layout{grid-template-rows:minmax(350px,70vh)auto 400px}.views{grid-row:2}.inspector{grid-row:3}}
.decision-evidence{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:white;cursor:auto}.decision-evidence summary{font-weight:600}.decision-evidence .kv{grid-template-columns:90px 1fr;line-height:1.65}.decision-evidence dd{white-space:pre-wrap}.decision-evidence .muted{line-height:1.6;margin-top:9px}
</style>
</head>
<body>
<header><div><h1>模拟聊天室 · 对话审阅</h1><div class="muted" id="refreshTime">完整保留客户原话和实际回复，逐轮查看与检验</div></div><div class="toolbar"><a href="/">控制台</a><a href="/tests">测试回放</a><button onclick="control('start')">启动</button><button class="primary" onclick="control('run_now')">运行一轮</button><button onclick="control('pause')">暂停</button><button onclick="control('resume')">恢复</button></div></header>
<section class="status-band"><div>调度器<strong id="schedulerStatus">-</strong></div><div>主 Agent<strong id="agentMode">-</strong></div><div>客户消息<strong id="generatorStatus">-</strong></div><div>本轮<strong id="turnCount">0</strong></div><div>工程质量<strong id="runStatus">-</strong></div><div>已审阅<strong id="reviewCount">0</strong></div><div class="error" id="runIssues"></div><div class="muted" id="controlStatus"></div></section>
<section class="review-band"><div class="toolbar"><select id="viewMode" onchange="changeView()" aria-label="查看范围"><option value="conversations">按会话查看</option><option value="topics">按剧本话题查看</option><option value="participants">按用户查看</option></select><input id="searchText" placeholder="搜索客户原话或 Agent 回复" aria-label="搜索对话" oninput="renderChat()"><label class="muted"><input type="checkbox" id="followLive" style="width:auto"> 跟随最新消息</label></div><div class="toolbar"><span class="muted">业务与话题正确性待检验</span><button onclick="downloadTranscript('markdown')">导出完整对话 MD</button><button onclick="downloadTranscript('jsonl')">导出证据 JSONL</button></div></section>
<main class="layout"><section class="pane runs"><div class="pane-head"><h2>运行记录</h2><span id="runTotal" class="badge">0</span></div><div id="runList" class="scroll"></div></section><section class="pane views"><div class="pane-head"><h2 id="viewTitle">会话</h2><span id="viewTotal" class="badge">0</span></div><div id="viewList" class="scroll"></div></section><section class="pane messages"><div class="chat-head"><div id="conversationTitle" class="chat-title">选择一次运行</div><div id="conversationMeta" class="muted">聊天记录会在每轮完成后保存，可随时回来查看。</div></div><div id="chatTimeline" class="chat"><div class="empty-state">暂无运行记录。运行后这里会显示完整多轮对话。</div></div></section><aside class="pane inspector"><div class="pane-head"><h2>本轮证据与人工检验</h2><span id="sequenceBadge" class="badge">-</span></div><div id="inspector" class="detail"><div class="empty-state">点击一轮对话查看</div></div></aside></main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pretty=value=>esc(JSON.stringify(value??{},null,2));
const state={data:null,runId:new URLSearchParams(location.search).get('run_id')||'',viewId:'',sequence:null,busy:false,drafts:{},evidenceOpen:{}};
const qualityNames={passed:'工程通过',failed:'失败',degraded:'存在异常',unknown:'待结束'};
const sourceNames={model:'模型客户',generation_failed:'客户生成失败（未发送）',glm:'模型生成',rule:'规则剧本',rule_fallback:'生成失败回退'};
const reviewNames={acceptable:'这轮可以',incorrect:'有问题',uncertain:'待确认'};
const phaseNames={business:'业务对话',chitchat:'闲聊插入',business_resume:'回到业务'};
const toolNames={search_current_games:'查询现成局',check_room_availability:'查询房态',create_game:'建局',search_customers:'查找牌友',create_invite_drafts:'生成邀约草稿',customer_visible_text_generation:'话术改写',customer_visible_content_review:'内容审查'};
function currentRun(){return state.data?.selected_run||{}}
function reviewKey(){return `${currentRun().run_id}:${state.sequence}`}
function currentViews(){return currentRun()[$('viewMode').value]||[]}
function idFor(view){return view.view_id||view.conversation_id||view.customer_id}
function currentView(){const views=currentViews();return views.find(view=>idFor(view)===state.viewId)||views[0]}
function currentTurn(){return (currentView()?.turns||[]).find(turn=>turn.sequence===state.sequence)}
// 仅投影已保存的决策摘要和执行证据，不生成或补写模型内部推理，也不从空关联 ID 推断数据库无局。
function decisionEvidence(turn){
 const actions=(turn.agent?.actions||[]).filter(action=>action&&typeof action==='object'&&!Array.isArray(action));
 const action=actions[actions.length-1]||{},objective=action.objective_state||{},key=`${currentRun().run_id}:${turn.sequence}`;
 const generation=[...(turn.tool_results||[])].reverse().find(tool=>tool.name==='customer_visible_text_generation'&&(tool.result?.items||[]).some(item=>item.item_id==='reply_to_user'||item.source==='reply_to_user'));
 const source=(generation?.result?.items||[]).find(item=>item.item_id==='reply_to_user'||item.source==='reply_to_user')?.source_text;
 const tools=(turn.tool_results||[]).map(tool=>`${toolNames[tool.name]||tool.name}：${tool.error?'失败':tool.called&&tool.allowed?'已执行':tool.deduplicated?'已去重':'未执行'}`).join('；');
 return `<details class="decision-evidence" data-evidence-key="${esc(key)}" ${state.evidenceOpen[key]?'open':''}><summary>模型决策摘要与执行证据</summary><p class="muted">这是保存的结构化摘要，不是完整内部推理；模型自述需与工具结果核对。本轮处理完成不等于已经成局。</p><dl class="kv"><dt>本轮目标</dt><dd>${esc(action.goal||'未记录')}</dd><dt>决策摘要</dt><dd>${esc(action.reasoning_summary||'未记录')}</dd><dt>运行状态</dt><dd>${esc(turn.agent?.status||turn.agent?.objective_status||'未记录')}</dd><dt>记录的动作</dt><dd>${esc(tools||'本轮未记录工具结果')}</dd><dt>主模型拟回复</dt><dd>${esc(source??'未记录改写前原文')}</dd></dl><details data-evidence-key="${esc(key)}:facts" ${state.evidenceOpen[`${key}:facts`]?'open':''}><summary>模型自述的已知事实、缺失条件与关联局</summary><pre>${pretty({known_facts:objective.known_facts||{},missing_facts:objective.missing_facts||[],active_game_id:objective.active_game_id??null})}</pre></details><details data-evidence-key="${esc(key)}:steps" ${state.evidenceOpen[`${key}:steps`]?'open':''}><summary>各步骤判断与停止依据</summary><pre>${pretty(actions.map(item=>({goal:item.goal,decision_summary:item.reasoning_summary,plan:item.objective_plan,plan_revision_reason:item.plan_revision_reason,stop_reason:item.stop_reason})))}</pre></details></details>`;
}
// 只刷新数据，不在用户回看旧消息时强行滚到底部或覆盖未保存备注。
async function refresh(){
 try{const q=state.runId?`?run_id=${encodeURIComponent(state.runId)}`:'';const r=await fetch('/api/simulations'+q);if(!r.ok)throw new Error(`HTTP ${r.status}`);const previous=currentRun().run_id;state.data=await r.json();if(previous&&previous!==currentRun().run_id){state.viewId='';state.sequence=null}render();$('refreshTime').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})} · 原始记录持续保存`}
 catch(error){$('controlStatus').textContent=`读取失败：${error.message}`}
}
async function control(action){
 if(state.busy)return;
 state.busy=true;$('controlStatus').textContent='正在提交';
 try{const r=await fetch('/api/simulations/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});const body=await r.json();if(!r.ok||body.ok===false)throw new Error(body.error||body.stderr||'操作失败');if(action==='run_now'){state.runId='';state.viewId='';state.sequence=null;$('searchText').value='';const url=new URL(location.href);url.searchParams.delete('run_id');history.replaceState(null,'',url);$('controlStatus').textContent=body.already_running?'已打开当前运行':'执行进程已启动，首轮对话生成后显示'}else $('controlStatus').textContent='操作完成';await refresh()}catch(e){$('controlStatus').textContent=e.message}finally{state.busy=false}
}
function render(){
 const run=currentRun(),report=run.report||{},scheduler=state.data.scheduler||{};
 $('schedulerStatus').textContent=scheduler.process_alive?(scheduler.worker_mode==='once'?'单次运行中':scheduler.enabled?'已启动':'已暂停'):'未启动';
 if(scheduler.last_error&&!scheduler.process_alive)$('controlStatus').textContent=`上次运行失败：${scheduler.last_error}`;
 $('agentMode').textContent=report.llm_mode==='real'?`真实模型 · ${report.main_agent_model||'型号未记录'}`:report.llm_mode==='mock'?'脚本模拟':'未记录';
 $('generatorStatus').textContent=report.message_generation_model||sourceNames[report.message_generation_mode]||report.message_generation_mode||'未记录';
 $('turnCount').textContent=`${run.turn_count||0} 轮`;$('runStatus').textContent=run.status==='running'?'运行中':run.status==='starting'?'正在启动':qualityNames[run.quality_status]||'待结束';
 $('runIssues').textContent=[report.unresolved_agent_output_count?`${report.unresolved_agent_output_count} 轮 Agent 未完成收尾`:report.agent_internal_failure_count?`${report.agent_internal_failure_count} 轮 Agent 中断`:'',report.customer_generation_failed_count?`${report.customer_generation_failed_count} 轮客户生成失败（未发送）`:''].filter(Boolean).join(' · ');
 $('reviewCount').textContent=`${run.review_summary?.reviewed_turns||0} / ${run.turn_count||0}`;
 const runs=state.data.runs||[];$('runTotal').textContent=runs.length;
 $('runList').innerHTML=runs.length?runs.map((item,index)=>`<button class="list-item ${state.runId===item.run_id||(!state.runId&&run.run_id===item.run_id)?'active':''}" data-run="${esc(item.run_id)}"><div class="list-title"><span>运行 ${runs.length-index}</span><span class="badge ${esc(item.quality_status)}">${esc(qualityNames[item.quality_status]||'待结束')}</span></div><div class="list-meta mono">${esc(item.run_id)}</div><div class="list-meta">${esc(item.total_messages)} 轮 · ${item.llm_mode==='real'?'真实模型':item.llm_mode==='mock'?'脚本模拟':'模式未记录'}</div></button>`).join(''):'<div class="empty-state">尚未运行</div>';
 $('runList').querySelectorAll('[data-run]').forEach(button=>button.onclick=()=>{state.runId=button.dataset.run;state.viewId='';state.sequence=null;refresh()});renderViews();renderChat();
}
function changeView(){state.viewId='';state.sequence=null;renderViews();renderChat()}
function renderViews(){
 const mode=$('viewMode').value,views=currentViews();$('viewTitle').textContent={conversations:'会话',topics:'剧本话题',participants:'模拟用户'}[mode];$('viewTotal').textContent=views.length;
 if(!views.some(view=>idFor(view)===state.viewId))state.viewId=views.length?idFor(views[0]):'';
 $('viewList').innerHTML=views.map(view=>{const title=mode==='participants'?view.display_name:mode==='topics'?view.title:(view.channel==='group'?'群聊':'私聊');const names=(view.participants||[]).map(person=>person.display_name).join('、');return `<button class="list-item ${state.viewId===idFor(view)?'active':''}" data-view="${esc(idFor(view))}"><div class="list-title"><span>${esc(title)}</span><span class="badge">${view.turn_count}轮</span></div><div class="list-meta">${esc(names||view.customer_id||view.conversation_id)}</div>${mode==='topics'?'<div class="list-meta">剧本标签 · 不代表识别正确</div>':''}</button>`}).join('');
 $('viewList').querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{state.viewId=button.dataset.view;state.sequence=null;$('followLive').checked=false;renderViews();renderChat()});
}
function renderChat(){
 const view=currentView(),mode=$('viewMode').value;if(!view){state.sequence=null;const running=['running','starting'].includes(currentRun().status);$('conversationTitle').textContent=running?'本轮对话正在生成':'暂无对话';$('conversationMeta').textContent=running?'运行已创建，首轮对话返回后会自动显示并保存':'选择一次运行查看已保存的对话';$('sequenceBadge').textContent='-';$('chatTimeline').innerHTML='<div class="empty-state">'+(running?'正在生成第一轮对话…':'暂无多轮对话')+'</div>';$('inspector').innerHTML='<div class="empty-state">点击一轮对话查看</div>';return}
 const term=$('searchText').value.trim().toLowerCase(),all=view.turns||[];
 const turns=all.filter(turn=>`${turn.user?.text||''} ${turn.agent?.reply||''} ${turn.user?.display_name||''}`.toLowerCase().includes(term));
 $('conversationTitle').textContent=mode==='participants'?view.display_name:mode==='topics'?view.title:view.channel==='group'?'群聊完整时间线':'私聊完整时间线';
 $('conversationMeta').textContent=`显示 ${turns.length} / ${all.length} 轮 · ${mode==='topics'?'话题为模拟器预设标签，模型识别尚未独立验收':'点击消息可查看生成依据和执行结果'} · 导出包含整次运行`;
 const chat=$('chatTimeline'),previousScroll=chat.scrollTop;const reviewMap=currentRun().reviews||{};
 if(!turns.some(turn=>turn.sequence===state.sequence)||($('followLive').checked&&!term))state.sequence=turns.length?turns[$('followLive').checked&&!term?turns.length-1:0].sequence:null;
 chat.innerHTML=turns.map(turn=>{const gen=turn.user?.generation||{},review=reviewMap[String(turn.sequence)];return `<article class="turn ${state.sequence===turn.sequence?'selected':''}" data-sequence="${Number(turn.sequence)}"><div class="speaker">#${turn.sequence} · ${esc(turn.user?.display_name||turn.user?.customer_id)} <span class="badge group">${turn.channel==='group'?'群聊':'私聊'}</span> <span class="badge">${esc(phaseNames[turn.dialog_phase]||turn.dialog_phase||'业务对话')}</span> ${review?`<span class="badge ${esc(review.verdict)}">${esc(reviewNames[review.verdict])}</span>`:''}</div><div class="bubble">${esc(turn.user?.text||'（空消息）')}</div><div class="foot"><span>${esc(sourceNames[gen.source]||gen.source||'规则剧本')}</span><span class="mono">剧本 ${esc(turn.thread_id||'未记录')}</span></div><div class="agent-row"><div class="bubble ${turn.agent?.reply?'':'empty'}">${esc(turn.agent?.reply||'（未回复）')}</div></div><div class="foot"><span>Agent · ${esc(turn.agent?.objective_status||'未记录状态')}</span><span>${esc(turn.latency_ms||0)} ms</span>${turn.error?`<span class="error">${esc(turn.error)}</span>`:''}</div>${decisionEvidence(turn)}</article>`}).join('')||'<div class="empty-state">没有匹配的对话</div>';
 chat.querySelectorAll('[data-sequence]').forEach(article=>article.onclick=()=>{state.sequence=Number(article.dataset.sequence);$('followLive').checked=false;chat.querySelectorAll('.turn').forEach(item=>item.classList.toggle('selected',item===article));renderInspector()});
 // 自动刷新后保留已展开的证据，避免审阅过程中被反复折叠。
 chat.querySelectorAll('[data-evidence-key]').forEach(detail=>detail.addEventListener('toggle',()=>{state.evidenceOpen[detail.dataset.evidenceKey]=detail.open}));
 if($('followLive').checked&&!term)chat.scrollTop=chat.scrollHeight;else chat.scrollTop=previousScroll;
 renderInspector();
}
function renderInspector(){
 const turn=currentTurn();if(!turn){$('sequenceBadge').textContent='-';$('inspector').dataset.fingerprint='';$('inspector').innerHTML='<div class="empty-state">选择一轮对话查看证据</div>';return}const key=reviewKey();
 // 自动刷新时保留当前编辑框，切换回合后才重新构造详情。
 const fingerprint=JSON.stringify([key,currentRun().reviews?.[String(turn.sequence)],turn]);if($('inspector').dataset.fingerprint===fingerprint)return;
 $('inspector').dataset.fingerprint=fingerprint;$('sequenceBadge').textContent=`第 ${turn.sequence} 轮`;
 const gen=turn.user?.generation||{},context=gen.context||{},review=currentRun().reviews?.[String(turn.sequence)];
 const observation=turn.simulation_observation||{};
 const profileEvidence=observation.profile_context_recorded?(observation.sender_profile?pretty(observation.sender_profile):'本轮未找到客户画像'):'未记录本轮画像快照，不能据此判断没有画像';
 $('inspector').innerHTML=`<section class="detail-section"><h3>人工检验</h3><div class="notice">工程通过只说明运行未发现异常。组局结果、话题归属和语气是否合适，需要结合对话与状态证据检验。</div><p class="muted">${review?'当前：'+esc(reviewNames[review.verdict]):'这轮尚未标注'}</p><textarea id="reviewNote" placeholder="哪里不对？例如：把两个人的话题混在一起，或回复太像客服。" aria-label="检验备注">${esc(state.drafts[key]??review?.note??'')}</textarea><div class="toolbar" style="margin-top:8px"><button data-verdict="acceptable">这轮可以</button><button data-verdict="incorrect">有问题</button><button data-verdict="uncertain">待确认</button></div></section><section class="detail-section"><h3>模拟消息从哪里来</h3><dl class="kv"><dt>来源</dt><dd>${esc(sourceNames[gen.source]||gen.source||'规则剧本')}</dd><dt>生成模型</dt><dd>${esc(gen.model||'未调用模型')}</dd><dt>生成耗时</dt><dd>${esc(gen.latency_ms||0)} ms</dd><dt>生成失败</dt><dd class="error">${esc(gen.error||'无')}</dd><dt>回应目的</dt><dd>${esc(gen.decision_reason||'未记录')}</dd><dt>客户意愿</dt><dd>${gen.wants_to_continue===false?'准备等待或结束':'继续对话'}</dd></dl><details><summary>查看场景原句、上轮回复与业务锚点</summary><pre>${pretty(context)}</pre></details><details><summary>参考案例与生成 trace</summary><pre>${pretty({reference_case_ids:gen.reference_case_ids||[],trace_id:gen.trace_id})}</pre></details></section><section class="detail-section"><h3>Agent 实际执行</h3><dl class="kv"><dt>目标状态</dt><dd>${esc(turn.agent?.objective_status||'未记录')}</dd><dt>HTTP 状态</dt><dd>${esc(turn.status_code??'-')}</dd><dt>trace</dt><dd class="mono">${esc(turn.agent?.trace_id||'-')}</dd><dt>错误</dt><dd class="error">${esc(turn.error||'无')}</dd></dl><details><summary>查看目标、工具参数与停止原因</summary><pre>${pretty(turn.agent?.actions||[])}</pre></details>${(turn.tool_results||[]).map(tool=>`<div class="tool"><span class="badge ${tool.error?'failed':'passed'}">${tool.error?'失败':tool.deduplicated?'已去重':tool.called&&tool.allowed?'已执行':'未执行'}</span> <span class="mono">${esc(tool.name)}</span><details><summary>完整工具结果</summary><pre>${pretty(tool.result||{})}</pre></details></div>`).join('')||'<div class="muted">本轮没有工具调用</div>'}<details><summary>查看持久化状态变化</summary><pre>${pretty(turn.state_transitions||[])}</pre></details></section><section class="detail-section"><h3>测试边界</h3><div class="muted">剧本线程 ${esc(turn.thread_id||'未记录')} 用来回看模拟任务，不是 Agent 推断的话题。相关发言用户不等于已确认入局的人。此模拟直接调用主 Agent Runtime，未覆盖生产群聊聚合入口和微信通道。</div></section>`;
 $('inspector').insertAdjacentHTML('afterbegin',`<section class="detail-section"><h3>画像与本次条件</h3><div class="muted">老板掌握的画像（本轮构建的模型上下文）</div><pre>${profileEvidence}</pre><details><summary>客户本人知道的本次条件（不暗送给老板）</summary><pre>${pretty(context.customer_facts||{})}</pre></details><details><summary>执行故障与停止原因</summary><pre>${pretty({failures:observation.execution_failures||[],stop_reason:observation.stop_reason,runtime_status:turn.agent?.status})}</pre></details></section>`);
 $('inspector').insertAdjacentHTML('beforeend',`<details><summary>本次模型与运行配置</summary><pre>${pretty({main_model:currentRun().report?.main_agent_model,customer_mode:currentRun().report?.message_generation_mode,runtime:currentRun().report?.main_agent_runtime_config,scenario:currentRun().report?.configuration})}</pre></details>`);
 $('reviewNote').oninput=event=>state.drafts[key]=event.target.value;
 $('inspector').querySelectorAll('[data-verdict]').forEach(button=>button.onclick=()=>saveReview(button.dataset.verdict));
}
async function saveReview(verdict){
 const key=reviewKey(),runId=currentRun().run_id,sequence=state.sequence,note=$('reviewNote').value;
 try{const r=await fetch('/api/simulations/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:runId,sequence,verdict,note})});const body=await r.json();if(!r.ok||!body.ok)throw new Error(body.error||'保存失败');delete state.drafts[key];$('inspector').dataset.fingerprint='';$('controlStatus').textContent='检验记录已保存';await refresh()}catch(e){$('controlStatus').textContent=e.message}
}
async function downloadTranscript(format){
 const runId=currentRun().run_id;if(!runId){$('controlStatus').textContent='请先选择有对话的运行';return}
 try{const r=await fetch(`/api/simulations/export?run_id=${encodeURIComponent(runId)}&format=${format}`);if(!r.ok)throw new Error((await r.json()).error||'导出失败');const url=URL.createObjectURL(await r.blob()),link=document.createElement('a');link.href=url;link.download=`${runId}.${format==='markdown'?'md':'jsonl'}`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('controlStatus').textContent=e.message}
}
$('chatTimeline').addEventListener('scroll',()=>{const chat=$('chatTimeline');if(chat.scrollHeight-chat.scrollTop-chat.clientHeight>100)$('followLive').checked=false});
$('followLive').addEventListener('change',renderChat);
refresh();setInterval(()=>{if(!state.busy)refresh()},2500);
</script>
</body>
</html>
